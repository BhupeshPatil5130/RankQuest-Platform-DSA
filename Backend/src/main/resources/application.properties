server.port=${PORT:8080}

# Database & JPA settings handled dynamically by DatabaseConfig
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

jwt.secret=${JWT_SECRET:RankQuestSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2024}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

google.client-id=${GOOGLE_CLIENT_ID:}

cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000,http://localhost:5173,https://rank-quest-platform-dsa.vercel.app,https://rankquest.vercel.app}

logging.level.com.rankquest=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
