# ─────────────────────────────────────────
# Server
# ─────────────────────────────────────────
server.address=0.0.0.0
server.port=${PORT:8080}

# ─────────────────────────────────────────
# DataSource — H2 defaults
# DatabaseUrlProcessor overrides spring.datasource.* when DATABASE_URL env var is set.
# For PostgreSQL deployments, set: DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD, DATABASE_DRIVER
# ─────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:rankquest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# HikariCP connection pool — initialization-fail-timeout=-1 prevents startup crash on slow DB
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-test-query=SELECT 1

# ─────────────────────────────────────────
# H2 Console (disabled in prod)
# ─────────────────────────────────────────
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# ─────────────────────────────────────────
# JPA / Hibernate
# Default to H2 dialect; DatabaseUrlProcessor overrides to PostgreSQLDialect when needed
# ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ─────────────────────────────────────────
# JWT
# ─────────────────────────────────────────
jwt.secret=${JWT_SECRET:RankQuestSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2024}
jwt.expiration-ms=${JWT_EXPIRATION:1296000000}

# ─────────────────────────────────────────
# Google OAuth
# ─────────────────────────────────────────
google.client-id=${GOOGLE_CLIENT_ID:}

# ─────────────────────────────────────────
# CORS
# ─────────────────────────────────────────
cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000,http://localhost:5173}

# ─────────────────────────────────────────
# Logging
# ─────────────────────────────────────────
logging.level.com.rankquest=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN
