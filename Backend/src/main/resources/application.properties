# ===============================================
# Server Configuration
# ===============================================
server.port=${PORT:8080}

# ===============================================
# Database Configuration
# -----------------------------------------------
# The app uses H2 (in-memory) by default for easy local dev.
# For production (Render/Railway), set these 3 environment variables
# and the PostgreSQL block below will take over automatically.
#
# Required env vars for production:
#   DATABASE_URL      = jdbc:postgresql://<host>/<db>?sslmode=require
#   DATABASE_USERNAME = <db user>
#   DATABASE_PASSWORD = <db password>
# ===============================================

# --- H2 In-Memory (local dev default) ---
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:rankquest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# Auto-detect driver from URL (works for both H2 and PostgreSQL)
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# H2 Console — enabled in dev (disabled automatically when DATABASE_URL is set to Postgres)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===============================================
# JPA / Hibernate Configuration
# ===============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Let Hibernate auto-detect the dialect from the datasource
spring.jpa.properties.hibernate.dialect=

# ===============================================
# JWT Configuration
# ===============================================
jwt.secret=${JWT_SECRET:RankQuestSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2024}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ===============================================
# Google OAuth Configuration
# Set GOOGLE_CLIENT_ID environment variable in production
# Get your Client ID from: https://console.cloud.google.com/
# ===============================================
google.client-id=${GOOGLE_CLIENT_ID:}

# ===============================================
# CORS Configuration
# Comma-separated list of allowed origins
# Example: https://rankquest.vercel.app,https://rankquest.com
# ===============================================
cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000,http://localhost:5173,https://rank-quest-platform-dsa.vercel.app}

# ===============================================
# Logging
# ===============================================
logging.level.com.rankquest=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN